    quote: null,
    text: {
      es: ["Parece que los diversos intentos de ajardinamiento del Ayuntamiento de Málaga han generado allí un orden estructurado por el hormigón, un jardín de cemento bordeado por dos acequias que transportan el agua de este saneamiento hasta el Mediterráneo. Dos acequias que nos gritan que sigue siendo un río a pesar de todo. Aquí nos encontramos con nada más y nada menos que con el único humedal postnatural del distrito centro de Málaga, de apenas cincuenta metros cuadrados, que se genera cuando la rotura en la acequia oeste provoca que el agua inunde parcialmente el pavimento y cruce hasta su gemela en el lado este.",
           "Desde este humedal accidental podemos observar cigüeñuelas, garzas y ánades. También observamos con sorpresa <i>Dytiscus marginalis</i>, ninfas de artrópodos, cangrejo rojo de río (especie invasora), especies del género <i>Lymnaea</i> y colémbolos. Todos estos organismos, junto a un cosmos botánico diverso, son aviso de un agua más limpia de lo que pudiera parecer en una primera lectura, libre de ciertos químicos y bien oxigenada, y además indicadores de un suelo capaz de sostener ciclos de vida que contradicen la imagen de un cauce definitivamente muerto.",
           "El río está permanentemente planificado y, al mismo tiempo, profundamente desatendido. Esta planificación constante produce una espera indefinida. Y en esa espera, la vida encuentra un margen para aparecer."],
      en: ["The various landscaping attempts by Málaga City Council seem to have produced there an order structured by concrete, a cement garden bordered by two channels that carry the water from this drainage to the Mediterranean. Two channels that shout at us that it is still a river in spite of everything. Here we find nothing less than the only post-natural wetland in Málaga's city centre, barely fifty square metres in size, which forms when a break in the west channel lets water partly flood the paving and cross over to its twin on the east side.",
           "From this accidental wetland we can observe black-winged stilts, herons and ducks. We also observe, with surprise, <i>Dytiscus marginalis</i>, arthropod nymphs, red swamp crayfish (an invasive species), species of the genus <i>Lymnaea</i> and springtails. All these organisms, together with a diverse botanical cosmos, signal water cleaner than it might seem at first reading, free of certain chemicals and well oxygenated, and they also indicate a soil able to sustain life cycles that contradict the image of a riverbed that is dead for good.",
           "The river is permanently planned and, at the same time, deeply neglected. This constant planning produces an indefinite wait. And in that wait, life finds a margin in which to appear."]

      en: ["The piece grows out of Rigor Plastic 1.0 (2023), selected for Ars Electronica, in which <i>Zophobas morio</i> larvae fed on a polystyrene human figure suspended over a bed of legumes. Humusidades turns that scene into a machine. Inside a glass vessel, the larvae eat expanded polystyrene rescued from beaches and landfills, a plastic that, according to recent research, they can break down thanks to bacteria in their gut. What they excrete settles in water. A small pump carries that water, loaded with organic matter, to a crop at the base of the structure, where the seeds sprout. What is waste for almost every living thing ends up as fertiliser."]

    quote: null,
    text: {
      es: ["En un momento en el que la cantidad de agua en los océanos apenas podrá ser medida en centímetros cúbicos y toneladas de sal, los Styrum emergerán como la última esperanza de la vida terrestre, consumiendo todos los restos plásticos para extraer carbono e hidrógeno. Habitarán en extensas colonias que se expandirán por lo que actualmente constituye el lecho oceánico, en grandes acumulaciones sobre lo que un día serán sucios recuerdos de nuestra existencia, en su mayoría irreconocibles. Los Styrum serán una especie de “pseudo-hongos”. Al igual que estos, y a diferencia de los vegetales, no realizarán la fotosíntesis. Su método reproductivo será la esporulación, pero también desarrollarán un sistema nervioso ramificado, convirtiendo a cada colonia en un único individuo.",
           "Durante las largas noches, emitirán una hipnótica iridiscencia que servirá de trampa para las pocas formas de vida que aún vagarán por nuestro planeta en busca de escasos recursos. Cuando estos desafortunados lleguen a una colonia de Styrum, su destino estará sellado, ya que las esporas invadirán el organismo del sujeto, dando inicio a una traicionera relación simbiótica. El Styrum proporcionará carbono, hidrógeno y sodio al huésped, guiándolo hacia la acumulación de residuos fósiles y plásticos sin colonizar más cercanos. Lo que el huésped desconocerá es que, tan pronto lleguen al que será el nuevo hábitat del Styrum, este comenzará a comportarse de manera parasitaria, consumiendo al individuo por completo y colonizando el nuevo territorio, reiniciando así su ciclo de vida."],
      en: ["At a time when the amount of water in the oceans can barely be measured in cubic centimetres and tonnes of salt, the Styrum will emerge as the last hope of life on Earth, consuming every plastic remnant to extract carbon and hydrogen. They will live in vast colonies spreading across what is now the ocean floor, in great accumulations over what will one day be grimy, mostly unrecognisable memories of our existence. The Styrum will be a kind of “pseudo-fungi”. Like fungi, and unlike plants, they will not photosynthesise. They will reproduce by sporulation, but they will also develop a branching nervous system, turning each colony into a single individual.",
           "During the long nights, they will give off a hypnotic iridescence that will act as a lure for the few forms of life still wandering the planet in search of scarce resources. When these unfortunate creatures reach a Styrum colony, their fate will be sealed: the spores will invade the subject's body, beginning a treacherous symbiotic relationship. The Styrum will supply the host with carbon, hydrogen and sodium, guiding it towards the nearest uncolonised accumulation of fossil waste and plastics. What the host will not know is that, as soon as they reach the Styrum's new habitat, it will begin to behave as a parasite, consuming the individual entirely and colonising the new territory, thus starting its life cycle again."]

    text: {

También podemos mirar por: cuando cuidamos de otro —ese que-quien, lo viviente y lo no viviente— miramos por este. Cuando hacemos de Lázaro, también vemos por el otro. Cuidar de es, por tanto, ayudar al que-quien a desenvolverse; tal vez más detalladamente. ¿Mirar es con detalle, no?

Ver es una capacidad; mirar, una decisión. Hay quien mira para otro lado, y quien lo hace por encima del hombro: es una decisión.

El agua brota desde abajo hacia arriba, pero cae de arriba hacia abajo. Igual que se ve desde arriba hacia abajo, pero no se mira. Desde abajo hacia arriba se ve, se mira, se brota; pero no se cae. Las gotas lo son porque caen poco a poco, dosificadamente. Pero desde abajo el agua brota: emana a borbotones, no gotea. Abajo se acumula, se filtra y se vuelve a acumular; arriba se escapa y se diluye, como ese ver sin mirar.

Me miró la última gota mientras caía; ya no había más. Yo no la vi. Se creyó infinita, pero no: lo era en sí misma, no fuera. Me miró la última gota mientras se desparramaba por el suelo; yo no la vi. Se acumuló un instante: no se filtró, no le dio tiempo. Me miró la última gota mientras se evaporaba; ya no había más. Yo no la vi. El último mililitro de humedad impregnó el ambiente árido: la sentí.

We can also look out for: when we care for another —that which-who, the living and the non-living— we look out for it. When we take on the figure of a Lazarus, we also see for the other. To care for is, then, to help the which-who find its way; perhaps in more detail. Looking means looking in detail, doesn't it?
