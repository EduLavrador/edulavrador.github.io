:root {
  /* Idea: hoja blanca, un solo color de lodo ácido para todo lo que se pulsa; datos de ficha en monoespaciada con flechas, como un cuaderno de campo */
  --paper: #ffffff;
  --ink: #23200f;
  --mud: #7A6A00;
  --mud-soft: #f3f0dc;
  --rule: #e4e0c8;
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
a { color: var(--mud); font-weight: 700; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--mud); outline-offset: 3px; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
.wrap { padding: 0 20px; max-width: 1400px; margin: 0 auto; }

/* Cabecera */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 0 28px; }
.menu { display: grid; gap: 2px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.02em; }
.menu a[aria-current="page"] { text-decoration-thickness: 3px; }
.lang { display: flex; gap: 2px; font-family: var(--mono); font-size: 13px; }
.lang button { background: none; border: 0; padding: 4px 6px; font: inherit; color: var(--mud); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--mud); color: var(--paper); }

/* Carrusel */
.car { position: relative; }
.car-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.car-track::-webkit-scrollbar { display: none; }
.car figure { margin: 0; flex: 0 0 auto; scroll-snap-align: start; display: grid; gap: 8px; }
.car img { height: var(--h, 62vh); width: auto; max-width: none; object-fit: cover; background: var(--mud-soft); }
.car figcaption { font-family: var(--mono); font-size: 12px; line-height: 1.45; color: var(--ink); opacity: 0.75; max-width: 46ch; }
.car figure.go { cursor: pointer; position: relative; overflow: hidden; }
.ripple { position: absolute; width: 0; height: 0; transform: translate(-50%, -50%); border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.9); box-shadow: 0 0 6px rgba(255,255,255,0.35); pointer-events: none; opacity: 0; animation: ripple 1.2s cubic-bezier(.2,.6,.3,1) forwards; }
.ripple.r2 { animation-delay: 0.14s; }
.ripple.r3 { animation-delay: 0.28s; border-width: 1px; }
@keyframes ripple { 0% { width: 0; height: 0; opacity: 0.95; } 100% { width: 360px; height: 360px; opacity: 0; } }
.car-ui { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--mud); }
.car-ui button { background: none; border: 1px solid var(--mud); color: var(--mud); font: inherit; padding: 4px 10px; cursor: pointer; }
.car-ui button:hover { background: var(--mud); color: var(--paper); }
.car-ui .count { font-variant-numeric: tabular-nums; }

/* Portada */
.intro { font-size: 15px; max-width: 52ch; margin: 34px 0 0; }
.feed { display: grid; gap: 72px; margin: 64px 0 80px; }
.entry { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 24px; align-items: start; }
.entry .meta { display: grid; gap: 0; font-size: 14px; position: sticky; top: 18px; }
.entry .meta a { font-size: 15px; margin-bottom: 8px; }
.entry .meta span { color: var(--mud); }
.entry .meta .yr { font-family: var(--mono); font-size: 12px; margin-top: 8px; }
.entry .shot { display: block; width: 100%; position: relative; overflow: hidden; }
.entry.m .shot { width: 76%; }
.entry.s .shot { width: 50%; }
.entry.right .shot { margin-left: auto; }
.group { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mud); margin: 0 0 -32px; padding-top: 16px; border-top: 1px solid var(--mud); }
.car figure.vid .yt-frame { height: var(--h, 62vh); aspect-ratio: 16 / 9; }
.field { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.field li { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
.field li b { font-weight: 400; color: var(--mud); }
.entry .shot img { width: 100%; height: auto; max-height: 78vh; object-fit: cover; transition: opacity 0.25s; }
.entry .shot:hover img { opacity: 0.88; }

/* Proyecto */
.phead { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 24px; margin-bottom: 36px; }
.phead h1 { font-size: 15px; margin: 0; color: var(--mud); text-transform: uppercase; letter-spacing: 0.02em; }
.ficha { font-family: var(--mono); font-size: 13px; line-height: 1.6; display: grid; gap: 2px; }
.pbody { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 24px; margin: 44px 0 64px; }
.pbody .side { display: grid; gap: 22px; align-content: start; }
.quote { font-style: italic; font-size: 15px; color: var(--mud); margin: 0; }
.quote cite { display: block; font-style: normal; font-family: var(--mono); font-size: 12px; margin-top: 6px; color: var(--ink); opacity: 0.7; }
.prose { max-width: 62ch; font-size: 17px; }
.prose p { margin: 0 0 1em; }
.box { border-top: 1px solid var(--mud); padding-top: 10px; font-size: 14px; display: grid; gap: 4px; }
.box h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 4px; color: var(--mud); }
.box .soft { opacity: 0.7; }
.escrito { max-width: 62ch; font-size: 17px; white-space: pre-line; }
.escrito.poem { line-height: 1.7; }
.esc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.esc-list li { display: block; }
.big { font-size: clamp(18px, 2.2vw, 26px); line-height: 1.35; max-width: 900px; }
.big .sub { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mud); margin: 0 0 20px; }
.big a { text-decoration-thickness: 1px; }
.infl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 15px; line-height: 1.5; }
.infl li { padding-left: 2em; text-indent: -2em; }
.infl a { font-weight: 400; overflow-wrap: anywhere; }
.contact p { margin: 0 0 22px; }
.contact span { font-size: 0.7em; }
.note { font-size: 13px; opacity: 0.7; margin-top: 28px; }
.vids { display: grid; gap: 28px; margin: 8px 0 0; max-width: 900px; }
.yt { display: grid; gap: 6px; }
.yt-frame { position: relative; aspect-ratio: 16 / 9; background: var(--ink); }
.yt-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.yt-play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; cursor: pointer; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: inherit; }
.yt-play { overflow: hidden; }
.yt-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; transition: transform 0.4s, filter 0.4s; filter: brightness(0.82); }
.yt-play:hover .yt-thumb { transform: scale(1.02); filter: brightness(0.7); }
.yt-play span { position: relative; display: grid; place-items: center; gap: 12px; font-size: 14px; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
.yt-play span::before { content: ""; width: 0; height: 0; border-left: 30px solid var(--paper); border-top: 18px solid transparent; border-bottom: 18px solid transparent; margin-left: 8px; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5)); }
.yt-play:hover span::before { border-left-color: var(--mud); }
.yt small { font-size: 12px; opacity: 0.75; }
.loop { display: grid; gap: 6px; }
.loop video { width: 100%; height: auto; display: block; background: var(--mud-soft); }
.loop figcaption { font-size: 12px; opacity: 0.75; }
.next { border-top: 1px solid var(--rule); padding: 28px 0 60px; font-size: 14px; }

/* Páginas de texto */
.page { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 24px; margin-bottom: 80px; }
.page h1 { font-size: 15px; margin: 0; color: var(--mud); text-transform: uppercase; letter-spacing: 0.02em; }
.cv { display: grid; gap: 36px; max-width: 820px; }
.cv h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mud); margin: 0 0 10px; }
.cv ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cv li { display: grid; grid-template-columns: 88px 1fr; gap: 12px; font-size: 15px; }
.cv li b { font-family: var(--mono); font-weight: 400; font-size: 13px; color: var(--mud); padding-top: 2px; font-variant-numeric: tabular-nums; }

footer { border-top: 1px solid var(--rule); padding: 18px 0 30px; font-family: var(--mono); font-size: 12px; color: var(--mud); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 760px) {
  .entry, .phead, .pbody, .page { grid-template-columns: 1fr; gap: 12px; }
  .entry .meta { position: static; }
  .entry.m .shot, .entry.s .shot { width: 100%; }
  .car figure.vid .yt-frame { width: 84vw; height: auto; }
  .group { margin-bottom: -20px; }
  .car img { width: 84vw; height: auto; max-height: var(--hm, 60vh); object-fit: cover; }
  .car figcaption { max-width: 84vw; }
  .pbody .side { order: 2; }
  .feed { gap: 56px; margin-top: 48px; }
  .prose { font-size: 16px; }
  .cv li { grid-template-columns: 72px 1fr; }
}
@media (prefers-reduced-motion: reduce) { .car-track { scroll-behavior: auto; } }
</style>

    es: `Bajo mis pies operan los principios sincréticos del suelo, un gran archivo aparentemente desordenado. Entierro mis manos en la humedad y palpo vestigios: minerales; rocas, polvo y vidrios; también orgánicos: raíces, lodo y trozos de plástico.

    es: `Es mirar con o mirar sin. Pero siempre mirar: más allá, dentro. Remirar o revisar.

Cuando miramos con, lo hacemos desde dentro: con los ojos, con las manos; percibiendo ondas, ya sean vibraciones, fotones o sonido. Cuando miramos desde afuera, miramos con el de al lado, con los de al lado; miramos al de enfrente, miramos al de arriba. El de arriba no nos mira; tal vez nos vea, pero no nos mira y, desde luego, no mira con nosotros ni para nosotros.

También podemos mirar por: cuando cuidamos de otro —ese que-quien, lo viviente y lo no viviente— miramos por este. Cuando hacemos de Lázaro, también vemos por el otro. Cuidar de es, por tanto, ayudar al que-quien a desenvolverse; tal vez más detalladamente. ¿Mirar es con detalle, no?

Ver es una capacidad; mirar, una decisión. Hay quien mira para otro lado, y quien lo hace por encima del hombro: es una decisión.

El agua brota desde abajo hacia arriba, pero cae de arriba hacia abajo. Igual que se ve desde arriba hacia abajo, pero no se mira. Desde abajo hacia arriba se ve, se mira, se brota; pero no se cae. Las gotas lo son porque caen poco a poco, dosificadamente. Pero desde abajo el agua brota: emana a borbotones, no gotea. Abajo se acumula, se filtra y se vuelve a acumular; arriba se escapa y se diluye, como ese ver sin mirar.

Me miró la última gota mientras caía; ya no había más. Yo no la vi. Se creyó infinita, pero no: lo era en sí misma, no fuera. Me miró la última gota mientras se desparramaba por el suelo; yo no la vi. Se acumuló un instante: no se filtró, no le dio tiempo. Me miró la última gota mientras se evaporaba; ya no había más. Yo no la vi. El último mililitro de humedad impregnó el ambiente árido: la sentí.

En otro lugar el agua brota a borbotones; no cesa. Todos lo ven todo el rato, todo el tiempo, en todas partes. Nadie los mira.`,
    en: `It is looking with or looking without. But always looking: beyond, within. Looking again, or looking over.

We can also look out for: when we care for another —that which-who, the living and the non-living— we look out for it. When we take on the figure of a Lazarus, we also see for the other. To care for is, then, to help the which-who find its way; perhaps in more detail. Looking means looking in detail, doesn't it?

Seeing is an ability; looking, a decision. There are those who look the other way, and those who look down on others: it is a decision.

Water springs from below upwards, but falls from above downwards. Just as one sees from above downwards, but does not look. From below upwards one sees, one looks, one springs; but one does not fall. Drops are drops because they fall little by little, in measured doses. But from below, water springs: it gushes forth, it does not drip. Below it gathers, filters and gathers again; above it escapes and dissolves, like that seeing without looking.

function carousel(items, opts = {}) {

function wireCarousels(auto) {
  document.querySelectorAll(".car").forEach(c => {
    const tr = c.querySelector(".car-track"), figs = [...tr.children], count = c.querySelector(".count");
    let i = 0;
    const go = n => { i = (n + figs.length) % figs.length; tr.scrollTo({ left: figs[i].offsetLeft - tr.offsetLeft, behavior: "smooth" }); };
    c.querySelectorAll("button[data-d]").forEach(b => b.addEventListener("click", () => { go(i + +b.dataset.d); stop(); }));
    tr.addEventListener("scroll", () => {
      const x = tr.scrollLeft; let best = 0, d = 1e9;
      figs.forEach((f, k) => { const dd = Math.abs(f.offsetLeft - tr.offsetLeft - x); if (dd < d) { d = dd; best = k; } });
      i = best; count.textContent = `${i + 1} / ${figs.length}`;
    }, { passive: true });
    let t = null; const stop = () => { clearInterval(t); t = null; };
    if (auto && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      t = setInterval(() => go(i + 1), 5000);
      ["pointerdown", "wheel", "touchstart", "keydown"].forEach(ev => tr.addEventListener(ev, stop, { passive: true }));
    }
  });
}

function pageHome() {
  menu("home");
  view.innerHTML = carousel(HERO, { h: "70vh", hm: "56vh" }) +
    `<div class="feed">` + PROJECTS.map((p, i) => `${i === 0 || PROJECTS[i - 1].group !== p.group ? `<h2 class="group">${p.group === "obra" ? UI[lang].works : UI[lang].lines}</h2>` : ""}
      <article class="entry ${p.size || ""}">
        <div class="meta">
          <a href="#${p.id}">${T(p.title)}</a>
          <span>${T(p.kind)}</span>
          <span>${p.where}</span>
          <span class="yr">${p.year}</span>
        </div>
        <a class="shot" href="#${p.id}" aria-label="${T(p.title)}">${img(p.cover, T(p.title))}</a>
      </article>`).join("") + `</div>`;
  wireCarousels(true);
  view.querySelectorAll(".car figure.go").forEach(f => f.addEventListener("click", e => {
    const id = f.dataset.go;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { location.hash = id; return; }
    const im = f.querySelector("img");
    const ok = im && waterRipple(f, im, e.clientX, e.clientY);
    if (!ok) ringRipple(f, e.clientX, e.clientY);
    setTimeout(() => { location.hash = id; }, ok ? 1700 : 650);
  }));
  view.querySelectorAll(".entry .shot").forEach(sh => sh.addEventListener("click", e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    e.preventDefault();
    const id = sh.getAttribute("href").slice(1), im = sh.querySelector("img");
    const ok = im && waterRipple(sh, im, e.clientX, e.clientY);
    if (!ok) ringRipple(sh, e.clientX, e.clientY);
    setTimeout(() => { location.hash = id; }, ok ? 1700 : 650);
  }));
}

/* Ondas de agua: simulación sobre la propia imagen, como una piedra que cae */
function waterRipple(fig, im, px, py) {
  try {
    if (fig.querySelector("canvas.water")) return true;
    const ir = im.getBoundingClientRect(), fr = fig.getBoundingClientRect();
    const S = ir.width * ir.height > 420000 ? 2 : 1, STEPS = S === 1 ? 3 : 2, W = Math.max(8, Math.round(ir.width / S)), H = Math.max(8, Math.round(ir.height / S));
    const src = document.createElement("canvas"); src.width = W; src.height = H;
    const sc = src.getContext("2d");
    const nw = im.naturalWidth, nh = im.naturalHeight, k = Math.max(W / nw, H / nh);
    sc.drawImage(im, (W - nw * k) / 2, (H - nh * k) / 2, nw * k, nh * k);
    const base = sc.getImageData(0, 0, W, H).data;
    const cv = document.createElement("canvas"); cv.className = "water"; cv.width = W; cv.height = H;
    cv.style.cssText = `position:absolute;left:${ir.left - fr.left}px;top:${ir.top - fr.top}px;width:${ir.width}px;height:${ir.height}px;pointer-events:none;`;
    fig.appendChild(cv);
    const ctx = cv.getContext("2d"), out = ctx.createImageData(W, H), o = out.data;
    let a = new Float32Array(W * H), b = new Float32Array(W * H);
    const drop = (x, y, r, str) => {
      for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
        const xx = x + i, yy = y + j, d = Math.sqrt(i * i + j * j);
        if (xx > 1 && yy > 1 && xx < W - 2 && yy < H - 2 && d <= r) a[yy * W + xx] += str * Math.cos((d / r) * Math.PI / 2);
      }
    };
    drop(Math.round((px - ir.left) / S), Math.round((py - ir.top) / S), S === 1 ? 8 : 5, 1100);
    const t0 = performance.now();
    const frame = t => {
      if (!cv.isConnected) return;
      for (let n = 0; n < STEPS; n++) {
        for (let y = 1; y < H - 1; y++) for (let x = 1, i = y * W + 1; x < W - 1; x++, i++)
          b[i] = ((a[i - 1] + a[i + 1] + a[i - W] + a[i + W]) * 0.5 - b[i]) * 0.991;
        const tmp = a; a = b; b = tmp;
      }
      for (let y = 1; y < H - 1; y++) for (let x = 1, i = y * W + 1; x < W - 1; x++, i++) {
        const dx = a[i - 1] - a[i + 1], dy = a[i - W] - a[i + W];
        let sx = x + (dx * 0.06 | 0), sy = y + (dy * 0.06 | 0);
        sx = sx < 0 ? 0 : sx >= W ? W - 1 : sx; sy = sy < 0 ? 0 : sy >= H ? H - 1 : sy;
        const si = (sy * W + sx) * 4, q = i * 4, l = (dx + dy) * 0.09;
        o[q] = base[si] + l; o[q + 1] = base[si + 1] + l; o[q + 2] = base[si + 2] + l * 1.05; o[q + 3] = 255;
      }
      ctx.putImageData(out, 0, 0);
      if (t - t0 < 6000) requestAnimationFrame(frame); else cv.remove();
    };
    requestAnimationFrame(frame);
    return true;
  } catch (err) { return false; }
}
function ringRipple(f, px, py) {
  const r = f.getBoundingClientRect();
  ["", " r2", " r3"].forEach(c => {
    const d = document.createElement("span"); d.className = "ripple" + c;
    d.style.left = (px - r.left) + "px"; d.style.top = (py - r.top) + "px";
    f.appendChild(d); setTimeout(() => d.remove(), 1600);
  });
}

function pageProject(p) {
  menu("proyectos");
  const i = PROJECTS.indexOf(p), nx = PROJECTS[(i + 1) % PROJECTS.length];
  const quote = p.quote ? `<blockquote class="quote">${p.quote[lang][0]}<cite>${p.quote[lang][1]}</cite></blockquote>` : "";
  const vids = p.videos ? `<div class="vids">${p.videos.map(([n0, id]) => { const n = T(n0); return `<div class="yt"><div class="yt-frame"><button type="button" class="yt-play" data-yt="${id}" aria-label="${UI[lang].play}: ${n}"><img class="yt-thumb" alt="" loading="lazy" src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg" onload="if(this.naturalWidth<200){this.onload=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'}" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'"><span>${n}</span></button></div><small><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">YouTube</a></small></div>`; }).join("")}</div>` : "";
  const loop = p.loop ? `<figure class="loop"><video poster="img/${p.loop.src}.jpg" autoplay muted loop playsinline preload="metadata"><source src="img/${p.loop.src}.mp4" type="video/mp4"><source src="img/${p.loop.src}.webm" type="video/webm"></video><figcaption>${p.loop.cap[lang]}</figcaption></figure>` : "";
  const rel = ESCRITOS.find(e => e.related === p.id);
  const relBox = rel ? `<div class="box"><h2>${UI[lang].text}</h2><a href="#${rel.id}">${rel.title[lang]}</a></div>` : "";
  const field = p.field ? `<div class="box"><h2>${UI[lang].fieldbook}</h2><ul class="field">${p.field[lang].map(([k, v]) => `<li><b>${k}</b><span>${v}</span></li>`).join("")}</ul></div>` : "";
  const cat = p.catalog ? `<div class="box"><h2>${UI[lang].catalog}</h2><span class="soft">${UI[lang].catalogSoon}</span></div>` : "";
  view.innerHTML = `
    <div class="phead">
      <h1>${T(p.title)}</h1>
      <div class="ficha">${p.ficha[lang].map(l => `<span>${l}</span>`).join("")}</div>
    </div>
    ${carousel(p.images, { h: "66vh", hm: "48vh" })}
    <div class="pbody">
      <div class="side">${quote}${field}${loop}${relBox}${cat}</div>
      <div><div class="prose">${p.text[lang].map(t => `<p>${t}</p>`).join("")}</div>${vids}</div>
    </div>
    <div class="next"><a href="#${nx.id}">${UI[lang].nextProject}: ${T(nx.title)}</a></div>`;
  wireCarousels(false);
  view.querySelectorAll(".yt-play").forEach(b => b.addEventListener("click", () => {
    const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&rel=0`;
    f.title = b.textContent.trim(); f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
    b.replaceWith(f);
  }));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) view.querySelectorAll(".loop video").forEach(v => { v.removeAttribute("autoplay"); v.pause(); v.controls = true; });
}

function list(sections) {
  return `<div class="cv">` + sections.map(s => `<section><h2>${T(s.h)}</h2><ul>${s.items.map(([y, t]) => `<li><b>${y}</b><span>${T(t)}</span></li>`).join("")}</ul></section>`).join("") + `</div>`;
}
function pageText(id) {
  menu(id);
  let body = "";
  if (id === "bio") body = `<div class="prose">${BIO[lang].map(t => `<p>${t}</p>`).join("")}</div>`;
  if (id === "cv") body = list(CV);
  if (id === "textos") body = `<div class="big"><h2 class="sub">${UI[lang].writings}</h2><ul class="esc-list">${ESCRITOS.map(e => `<li><a href="#${e.id}">${e.title[lang]}</a></li>`).join("")}</ul>${TEXTS.length ? list(TEXTS) : ""}<h2 class="sub" style="margin-top:56px">${UI[lang].influenced}</h2><ul class="infl">${INFLUENCES.map(t => `<li>${t}</li>`).join("")}</ul></div>`;
  if (id === "contacto") body = `<div class="big contact"><p><a href="mailto:${CONTACT.email}">${CONTACT.email}</a><br><a href="mailto:${CONTACT.uni}">${CONTACT.uni}</a> <span style="opacity:.7">(${lang === "es" ? "Universidad de Murcia" : "University of Murcia"})</span></p><p><a href="https://www.instagram.com/${CONTACT.ig}/" target="_blank" rel="noopener">Instagram @${CONTACT.ig}</a></p><p>Málaga</p></div>`;
  const title = { bio: UI[lang].bio, cv: UI[lang].cv, textos: UI[lang].texts, contacto: UI[lang].contact }[id];
  view.innerHTML = `<div class="page"><h1>${title}</h1>${body}</div>`;
}

function pageEscrito(e) {
  menu("textos");
  const note = UI[lang].origNote ? `<p class="note">${UI[lang].origNote}</p>` : "";
  view.innerHTML = `<div class="page"><h1>${UI[lang].writings}</h1><div><h2 style="font-size:15px;margin:0 0 24px;color:var(--mud)">${e.title[lang]}</h2><div class="escrito${e.poem ? " poem" : ""}">${e[lang]}</div>${note}</div></div><div class="next"><a href="#textos">${UI[lang].texts}</a></div>`;
}

function route() {
  const h = location.hash.slice(1);
  const p = PROJECTS.find(x => x.id === h);
  const es = ESCRITOS.find(x => x.id === h);
  if (es) pageEscrito(es);
  else if (p) pageProject(p);
  else if (["bio", "cv", "textos", "contacto"].includes(h)) pageText(h);
  else pageHome();
  scrollTo(0, 0);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  const y = scrollY; route(); scrollTo(0, y);
}));
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
